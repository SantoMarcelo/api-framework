name: Java · Rest Assured

# Brings up the Loja QA backend from the portifolio repository and runs the Java suite against it.
# Only changes to this framework (or to this workflow) trigger it: every stack in the repo is independent.
on:
  push:
    branches: [main]
    paths:
      - java-rest-assured/**
      - .github/workflows/java-rest-assured.yml
  pull_request:
    paths:
      - java-rest-assured/**
      - .github/workflows/java-rest-assured.yml
  workflow_dispatch:
    inputs:
      groups:
        description: JUnit tag(s) to run (contract, functional, document-files, unit)
        default: contract
      backend_ref:
        description: Branch, tag or SHA of SantoMarcelo/portifolio to test against
        default: main

concurrency:
  group: java-rest-assured-${{ github.ref }}
  cancel-in-progress: true

# checks: write lets the JUnit report publish its own check run (with per-test annotations) on the commit/PR;
# contents: write lets the Allure report be pushed to the gh-pages branch (served by GitHub Pages)
permissions:
  contents: write
  checks: write

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    env:
      # Throwaway database seeded on every run; these are the seed accounts the API documents.
      BASE_URL: http://localhost:3333
      API_BASE_PATH: /api
      DEFAULT_USER_ID: 2
      DEFAULT_USER_USERNAME: cliente@loja.com
      DEFAULT_USER_PASSWORD: Cliente@123
      ADMIN_USER_ID: 1
      ADMIN_USER_USERNAME: admin@loja.com
      ADMIN_USER_PASSWORD: Admin@123

    steps:
      - name: Checkout tests
        uses: actions/checkout@v4

      # A private repository needs the PORTIFOLIO_TOKEN secret (fine-grained PAT, Contents: read on
      # SantoMarcelo/portifolio). For a public one the default token is enough.
      - name: Checkout backend (SantoMarcelo/portifolio)
        uses: actions/checkout@v4
        with:
          repository: SantoMarcelo/portifolio
          ref: ${{ inputs.backend_ref || 'main' }}
          token: ${{ secrets.PORTIFOLIO_TOKEN || github.token }}
          path: portifolio

      # Only the backend: the frontend is not needed by API tests. --wait blocks until the healthcheck passes.
      - name: Start backend
        working-directory: portifolio
        run: docker compose up -d --build --wait backend

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      # DefaultUserContractTest belongs to the template's example domain (routes that do not exist here)
      - name: Run tests
        working-directory: java-rest-assured
        run: mvn -B test -Dgroups="${{ inputs.groups || 'contract' }}" -Dtest='!DefaultUserContractTest' -Dsurefire.failIfNoSpecifiedTests=false

      # Renders the surefire results in the run's Summary page and as a "Test report" check, with
      # failures annotated on the test source lines
      - name: Publish test report
        if: always()
        uses: mikepenz/action-junit-report@v5
        with:
          report_paths: java-rest-assured/target/surefire-reports/TEST-*.xml
          check_name: Test report (${{ inputs.groups || 'contract' }})
          include_passed: true
          detailed_summary: true
          require_tests: true

      - name: Build Allure report
        if: always()
        working-directory: java-rest-assured
        run: mvn -B allure:report

      - name: Upload Allure report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-report
          path: java-rest-assured/target/site/allure-maven-plugin
          if-no-files-found: ignore

      # Each run gets its own folder on gh-pages (java-rest-assured/<run id>/), so the link in older runs keeps
      # working. Fork PRs have a read-only token and cannot push, so they only get the artifact.
      - name: Publish Allure report to GitHub Pages
        id: pages
        if: always() && hashFiles('java-rest-assured/target/site/allure-maven-plugin/index.html') != '' && github.event.pull_request.head.repo.fork != true
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          publish_dir: java-rest-assured/target/site/allure-maven-plugin
          destination_dir: java-rest-assured/${{ github.run_id }}
          keep_files: true
          commit_message: 'docs(allure): java-rest-assured report for run ${{ github.run_id }}'

      - name: Link Allure report in the run summary
        if: always() && steps.pages.outcome == 'success'
        env:
          REPORT_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/java-rest-assured/${{ github.run_id }}/
        run: |
          {
            echo "## 📊 Allure report"
            echo ""
            echo "**[Open the Allure report](${REPORT_URL})** — Ctrl/Cmd + click to open it in a new tab."
            echo ""
            echo "_GitHub Pages takes about a minute to publish it after this run._"
          } >> "$GITHUB_STEP_SUMMARY"
          echo "::notice title=Allure report::${REPORT_URL}"

      - name: Upload surefire reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports
          path: java-rest-assured/target/surefire-reports
          if-no-files-found: ignore

      - name: Backend logs
        if: failure()
        working-directory: portifolio
        run: docker compose logs backend

      - name: Stop backend
        if: always()
        working-directory: portifolio
        run: docker compose down -v
